<div class="player-banner w-100 d-flex align-items-center gap-3 rounded-4 px-4 py-3 position-relative" [class]="player.colorClass" *ngIf="player">
  <div class="flex-grow-1 overflow-hidden">
    <div class="font-mono text-uppercase text-muted-app mb-1" style="letter-spacing: 2px; font-size: .58rem">Jogando agora</div>
    <div class="fw-bolder fs-5" style="letter-spacing: -.3px">{{ player.name }}</div>
  </div>
  <div class="text-end">
    <div class="font-mono text-uppercase text-muted-app" style="letter-spacing: 1.5px; font-size: .55rem">Pontos</div>
    <div class="banner-score font-mono fw-bold">{{ player.score }}</div>
  </div>
</div>
